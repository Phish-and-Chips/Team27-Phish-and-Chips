<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Young Adult Support Agent - Demo</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background-color: #f9f9f9;
        }
        
        header {
            background-color: #00897b;
            color: white;
            padding: 1rem;
            text-align: center;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 1rem;
            flex: 1;
        }
        
        .chat-container {
            border-radius: 10px;
            background-color: white;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 70vh;
        }
        
        .chat-header {
            background-color: #00897b;
            color: white;
            padding: 0.8rem;
            display: flex;
            align-items: center;
        }
        
        .agent-icon {
            width: 30px;
            height: 30px;
            margin-right: 10px;
            background-color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #00897b;
        }
        
        .chat-messages {
            flex: 1;
            padding: 1rem;
            overflow-y: auto;
        }
        
        .message {
            margin-bottom: 1rem;
            display: flex;
        }
        
        .user-message {
            justify-content: flex-end;
        }
        
        .bot-message {
            justify-content: flex-start;
        }
        
        .message-content {
            padding: 0.8rem;
            border-radius: 18px;
            max-width: 70%;
        }
        
        .user-message .message-content {
            background-color: #e3f2fd;
        }
        
        .bot-message .message-content {
            background-color: #f1f1f1;
        }
        
        .bot-message.financial .message-content {
            background-color: #e8f5e9;
        }
        
        .bot-message.health .message-content {
            background-color: #e1f5fe;
        }
        
        .bot-message.banking .message-content {
            background-color: #fff8e1;
        }
        
        .chat-input {
            padding: 1rem;
            background-color: #f5f5f5;
            display: flex;
        }
        
        .chat-input input {
            flex: 1;
            padding: 0.8rem;
            border: 1px solid #ddd;
            border-radius: 20px;
            outline: none;
        }
        
        .chat-input button {
            margin-left: 0.5rem;
            padding: 0.8rem 1.5rem;
            background-color: #00897b;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
        }
        
        .chat-input button:hover {
            background-color: #00796b;
        }
        
        .agent-label {
            font-size: 0.7rem;
            color: #666;
            margin-bottom: 0.3rem;
        }
    </style>
</head>
<body>
    <header>
        <h1>Young Adult Support Agent</h1>
        <p>Get help with finance, health, and banking questions</p>
    </header>
    
    <div class="container">
        <div class="chat-container">
            <div class="chat-header">
                <div class="agent-icon" id="agent-icon">R</div>
                <span id="agent-name">Support Agent</span>
            </div>
            
            <div class="chat-messages" id="chat-messages">
                <div class="message bot-message">
                    <div class="message-content">
                        <div class="agent-label">Router</div>
                        Hello! I'm here to help you with questions about finances, mental health, or banking products. What can I assist you with today?
                    </div>
                </div>
            </div>
            
            <div class="chat-input">
                <input type="text" id="user-input" placeholder="Type your message here..." />
                <button id="send-button">Send</button>
            </div>
        </div>
    </div>
    
    <script>
        // Configuration
        const API_URL = 'http://localhost:8000/chat';
        
        // DOM elements
        const messagesContainer = document.getElementById('chat-messages');
        const userInput = document.getElementById('user-input');
        const sendButton = document.getElementById('send-button');
        const agentIcon = document.getElementById('agent-icon');
        const agentName = document.getElementById('agent-name');
        
        // Conversation history
        let conversationHistory = [];
        let currentAgentType = 'router';
        
        // Agent display information
        const agentInfo = {
            router: { icon: 'R', name: 'Support Agent' },
            financial: { icon: 'F', name: 'Financial Advisor' },
            health: { icon: 'H', name: 'Health Specialist' },
            banking: { icon: 'B', name: 'Banking Specialist' }
        };
        
        // Function to add a message to the chat
        function addMessage(message, isUser, agentType = null) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user-message' : 'bot-message'}`;
            
            if (!isUser && agentType) {
                messageDiv.classList.add(agentType);
            }
            
            const messageContent = document.createElement('div');
            messageContent.className = 'message-content';
            
            if (!isUser && agentType) {
                const agentLabel = document.createElement('div');
                agentLabel.className = 'agent-label';
                agentLabel.textContent = agentInfo[agentType].name;
                messageContent.appendChild(agentLabel);
            }
            
            messageContent.appendChild(document.createTextNode(message));
            messageDiv.appendChild(messageContent);
            messagesContainer.appendChild(messageDiv);
            
            // Scroll to bottom
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }
        
        // Function to send a message to the API
        async function sendMessage(message) {
            try {
                // Display user message
                addMessage(message, true);
                
                // Disable input while waiting
                userInput.disabled = true;
                sendButton.disabled = true;
                
                // Prepare request
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: message,
                        agent_type: currentAgentType,
                        history: conversationHistory
                    })
                });
                
                const data = await response.json();
                
                // Update agent type if changed
                if (data.agent_type !== currentAgentType) {
                    currentAgentType = data.agent_type;
                    updateAgentDisplay();
                }
                
                // Display bot response
                addMessage(data.response, false, currentAgentType);
                
                // Update conversation history
                conversationHistory.push({ role: 'user', content: message });
                conversationHistory.push({ role: 'assistant', content: data.response });
                
            } catch (error) {
                console.error('Error:', error);
                addMessage('Sorry, there was an error processing your request. Please try again later.', false);
            } finally {
                // Re-enable input
                userInput.disabled = false;
                sendButton.disabled = false;
                userInput.focus();
            }
        }
        
        // Function to update the agent display
        function updateAgentDisplay() {
            const agent = agentInfo[currentAgentType];
            agentIcon.textContent = agent.icon;
            agentName.textContent = agent.name;
        }
        
        // Event listeners
        sendButton.addEventListener('click', () => {
            const message = userInput.value.trim();
            if (message) {
                sendMessage(message);
                userInput.value = '';
            }
        });
        
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                const message = userInput.value.trim();
                if (message) {
                    sendMessage(message);
                    userInput.value = '';
                }
            }
        });
        
        // Focus input on load
        userInput.focus();
    </script>
</body>
</html>
